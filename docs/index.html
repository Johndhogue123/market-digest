<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Market Digest</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Public+Sans:wght@400;500;600;700&display=swap">
<style>
:root {
  --bg: #0d1117; --surface: #151b23; --surface-2: #1c2430; --line: #263041;
  --fg: #e8ecf2; --muted: #8a96a8; --accent: #f2b84b; --accent-ink: #1a1303;
  --up: #34c38f; --down: #f0626f; --up-bg: rgba(52,195,143,.14); --down-bg: rgba(240,98,111,.14);
  --font-body: "Public Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-num: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg: #f4f5f7; --surface: #fff; --surface-2: #eceff3; --line: #d9dee6;
    --fg: #151a22; --muted: #5d6879; --accent: #b87a0c; --up: #0f8a5f; --down: #c93a49;
    --up-bg: rgba(15,138,95,.12); --down-bg: rgba(201,58,73,.1); color-scheme: light;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.45 var(--font-body); padding: 18px 16px 48px; }
.wrap { max-width: 720px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
h1 { margin: 0; font-size: 24px; letter-spacing: -.01em; }
h2 { margin: 6px 0 0; font-size: 13px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); font-weight: 600; }
.sub { margin: 4px 0 0; color: var(--muted); font-size: 13px; }
.demo { border: 1px solid var(--accent); color: var(--accent); border-radius: 8px; padding: 8px 12px; font-size: 13px; }
.strip { display: grid; grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); gap: 6px; }
.chip { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 7px 9px; min-width: 0; }
.chip .s { font-family: var(--font-num); font-weight: 600; font-size: 13px; }
.chip .n { color: var(--muted); font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.chip .p { font-family: var(--font-num); font-size: 13px; font-weight: 600; }
.up { color: var(--up); } .down { color: var(--down); }
.breadth { height: 8px; border-radius: 4px; overflow: hidden; display: flex; background: var(--line); }
.breadth i { display: block; height: 100%; }
.tabs { display: grid; grid-template-columns: 1fr 1fr; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 3px; gap: 2px; }
.tabs button { font: inherit; background: transparent; border: 0; border-radius: 7px; padding: 9px 4px; font-weight: 600; font-size: 14px; color: var(--muted); cursor: pointer; }
.tabs button[aria-selected="true"] { background: var(--surface-2); color: var(--fg); box-shadow: inset 0 0 0 1px var(--line); }
.explain { margin: 0; font-size: 13px; color: var(--muted); }
.list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.row { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.head { width: 100%; font: inherit; color: inherit; background: transparent; border: 0; text-align: left; cursor: pointer; padding: 12px; display: grid; grid-template-columns: minmax(0,1fr) auto; gap: 4px 12px; align-items: center; }
.tk { font-family: var(--font-num); font-weight: 600; font-size: 17px; }
.nm { color: var(--muted); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.chg { font-family: var(--font-num); font-size: 13px; font-weight: 600; padding: 3px 8px; border-radius: 6px; white-space: nowrap; justify-self: end; }
.chg.up { background: var(--up-bg); } .chg.down { background: var(--down-bg); }
.meta { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; min-width: 0; }
.tag { font-size: 11px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; padding: 2px 6px; border-radius: 4px; border: 1px solid var(--accent); color: var(--accent); }
.tag.solid { background: var(--accent); color: var(--accent-ink); }
.tag.dim { border-color: var(--line); color: var(--muted); }
.ratio { font-family: var(--font-num); font-size: 12px; color: var(--muted); justify-self: end; white-space: nowrap; }
.detail { border-top: 1px solid var(--line); padding: 12px; display: flex; flex-direction: column; gap: 12px; background: var(--surface-2); }
.detail[hidden] { display: none; }
.bar { position: relative; height: 8px; border-radius: 4px; background: var(--line); margin: 10px 6px 2px; }
.bar .dot { position: absolute; top: 50%; width: 14px; height: 14px; border-radius: 50%; background: var(--fg); border: 3px solid var(--surface-2); transform: translate(-50%,-50%); }
.bar .tick { position: absolute; top: -4px; width: 2px; height: 16px; background: var(--muted); transform: translateX(-50%); opacity: .6; }
.lbl { display: flex; justify-content: space-between; font-family: var(--font-num); font-size: 12px; color: var(--muted); }
.read { margin: 0; font-size: 14px; } .read b { color: var(--accent); font-weight: 600; }
.news { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.news a { color: var(--fg); font-weight: 600; font-size: 14px; text-decoration: none; }
.news a:hover { text-decoration: underline; }
.news span { display: block; color: var(--muted); font-size: 12px; }
.links { display: flex; flex-wrap: wrap; gap: 8px; }
.links a { color: var(--fg); text-decoration: none; font-size: 13px; font-weight: 600; border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 6px 10px; }
.empty { text-align: center; color: var(--muted); padding: 28px 12px; border: 1px dashed var(--line); border-radius: 10px; }
footer { color: var(--muted); font-size: 12px; }
a:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
</style>
</head>
<body>
<main class="wrap">
  <header>
    <h1>Market Digest</h1>
    <p class="sub" id="asof">Loading</p>
  </header>
  <div class="demo" id="demo" hidden>Preview with made-up numbers. Real data appears after the first scheduled run.</div>

  <h2>Market</h2>
  <div class="breadth" id="breadth" role="img"></div>
  <p class="explain" id="breadthText"></p>
  <div class="strip" id="market"></div>

  <div class="tabs" role="tablist">
    <button role="tab" data-tab="unusual" aria-selected="true">Unusual moves</button>
    <button role="tab" data-tab="swingers" aria-selected="false">Big swingers</button>
  </div>
  <p class="explain" id="explain"></p>
  <ul class="list" id="list"></ul>

  <footer>Prices from Alpaca's free IEX feed, so volumes run lower than on Robinhood. Headlines from Benzinga via Alpaca. Not investment advice.</footer>
</main>
<script>
(function () {
  var data = null, tab = "unusual", open = {};
  var $ = function (id) { return document.getElementById(id); };
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
  function pct(p) { return (p > 0 ? "+" : "") + p.toFixed(2) + "%"; }
  function price(p) { return p >= 1 ? p.toFixed(2) : p.toFixed(4); }
  function cls(p) { return p >= 0 ? "up" : "down"; }
  function ago(t) {
    var m = Math.round((Date.now() - new Date(t)) / 60000);
    if (!isFinite(m)) return "";
    return m < 60 ? m + "m ago" : m < 1440 ? Math.round(m / 60) + "h ago" : Math.round(m / 1440) + "d ago";
  }

  function bar(r) {
    var span = r.high - r.low; if (!(span > 0)) return "";
    function pos(v) { return Math.max(0, Math.min(100, (v - r.low) / span * 100)); }
    return '<div><div class="bar">' +
      '<span class="tick" style="left:' + pos(r.prev) + '%" title="Yesterday\'s close"></span>' +
      '<span class="dot" style="left:' + pos(r.price) + '%"></span></div>' +
      '<div class="lbl"><span>Low ' + price(r.low) + '</span><span>High ' + price(r.high) + '</span></div></div>';
  }

  function detail(r) {
    var t = encodeURIComponent(r.symbol);
    var news = (r.news || []).map(function (n) {
      return '<li><a href="' + esc(n.url) + '" target="_blank" rel="noopener">' + esc(n.headline) + '</a>' +
        '<span>' + esc(n.source) + ' · ' + esc(ago(n.time)) + '</span></li>';
    }).join("");
    return bar(r) +
      (r.read ? '<p class="read"><b>' + esc(r.read.title) + '.</b> ' + esc(r.read.text) + '</p>' : "") +
      '<p class="read">Usually moves about <b>' + (r.normal != null ? r.normal.toFixed(1) : "?") + '%</b> a day. Today is ' +
      (r.ratio != null ? r.ratio.toFixed(1) + '× that.' : 'unknown.') + '</p>' +
      (news ? '<ul class="news">' + news + '</ul>' : '<p class="explain">No headlines in the last day and a half.</p>') +
      '<div class="links"><a href="https://robinhood.com/stocks/' + t + '" target="_blank" rel="noopener">Robinhood</a>' +
      '<a href="https://www.google.com/finance/quote/' + t + '" target="_blank" rel="noopener">Google Finance</a>' +
      '<a href="https://finance.yahoo.com/quote/' + t + '/news" target="_blank" rel="noopener">Yahoo news</a></div>';
  }

  function row(r) {
    var tags = "";
    if (r.read && r.read.kind === "fade") tags += '<span class="tag solid">Fading</span>';
    if (r.read && r.read.kind === "recover") tags += '<span class="tag">Recovering</span>';
    if (tab === "swingers") tags += '<span class="tag ' + (r.usual === "Bigger than usual" ? "" : "dim") + '">' + esc(r.usual) + '</span>';
    var isOpen = !!open[r.symbol];
    return '<li class="row" data-s="' + esc(r.symbol) + '"><button class="head" aria-expanded="' + isOpen + '">' +
      '<span><span class="tk">' + esc(r.symbol) + '</span> <span class="nm">' + esc(r.name) + '</span></span>' +
      '<span class="chg ' + cls(r.pct) + '">' + pct(r.pct) + '</span>' +
      '<span class="meta">' + tags + '<span class="nm">' + price(r.price) + '</span></span>' +
      '<span class="ratio">' + (r.ratio != null ? r.ratio.toFixed(1) + '× normal' : '') + '</span>' +
      '</button><div class="detail"' + (isOpen ? '' : ' hidden') + '>' + (isOpen ? detail(r) : '') + '</div></li>';
  }

  function render() {
    var s = data.settings;
    $("explain").textContent = tab === "unusual"
      ? "Moving at least " + s.unusual_ratio + "× their normal daily swing (average of the last " + s.lookback + " days)."
      : "Stocks that usually move " + s.swinger_normal + "% or more a day, ranked by today's move.";
    var rows = data[tab];
    $("list").innerHTML = rows.length ? rows.map(row).join("") : '<li class="empty">Nothing unusual right now.</li>';
  }

  function boot(d) {
    data = d;
    var when = new Date(d.generated);
    $("asof").textContent = d.slot + " update · " + when.toLocaleString([], { weekday: "short", month: "short", day: "numeric", hour: "numeric", minute: "2-digit" });
    $("demo").hidden = !d.demo;
    var b = d.breadth, upW = b.total ? b.up / b.total * 100 : 0;
    $("breadth").innerHTML = '<i style="width:' + upW + '%;background:var(--up)"></i><i style="width:' + (100 - upW) + '%;background:var(--down)"></i>';
    $("breadth").setAttribute("aria-label", b.up + " up, " + b.down + " down");
    $("breadthText").textContent = b.up + " up, " + b.down + " down across " + b.total + " stocks and ETFs.";
    $("market").innerHTML = d.market.map(function (r) {
      return '<div class="chip"><div class="s">' + esc(r.symbol) + '</div><div class="n">' + esc(r.name) + '</div>' +
        '<div class="p ' + cls(r.pct) + '">' + pct(r.pct) + '</div></div>';
    }).join("");
    render();
  }

  $("list").addEventListener("click", function (e) {
    var h = e.target.closest(".head"); if (!h) return;
    var s = h.parentNode.getAttribute("data-s"); open[s] = !open[s]; render();
  });
  document.querySelector(".tabs").addEventListener("click", function (e) {
    var b = e.target.closest("button[data-tab]"); if (!b) return;
    tab = b.getAttribute("data-tab");
    document.querySelectorAll(".tabs button").forEach(function (x) { x.setAttribute("aria-selected", x === b); });
    render();
  });

  fetch("data.json", { cache: "no-store" }).then(function (r) { return r.json(); }).then(boot).catch(function () {
    $("asof").textContent = "No data yet";
    $("list").innerHTML = '<li class="empty">The first update arrives after the next scheduled run.</li>';
  });
})();
</script>
</body>
</html>
