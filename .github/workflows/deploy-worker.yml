name: Deploy live worker

# Puts worker/ on Cloudflare (free plan) and points the page at it by writing
# docs/live.json. Needs repo secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID
# in addition to the Alpaca keys. Re-runs by itself when worker/ changes.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["worker/**"]

permissions:
  contents: write

concurrency:
  group: digest
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Deploy
        if: env.CLOUDFLARE_API_TOKEN != ''
        working-directory: worker
        env:
          ALPACA_KEY_ID: ${{ secrets.ALPACA_KEY_ID }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          DISPATCH_TOKEN: ${{ secrets.DISPATCH_TOKEN }}
        run: |
          npx --yes wrangler@4 deploy | tee deploy.log
          printf '%s' "$ALPACA_KEY_ID" | npx --yes wrangler@4 secret put ALPACA_KEY_ID
          printf '%s' "$ALPACA_SECRET_KEY" | npx --yes wrangler@4 secret put ALPACA_SECRET_KEY
          [ -z "$DISPATCH_TOKEN" ] || printf '%s' "$DISPATCH_TOKEN" | npx --yes wrangler@4 secret put DISPATCH_TOKEN
          url=$(grep -oE 'https://[A-Za-z0-9.-]+\.workers\.dev' deploy.log | head -1)
          [ -n "$url" ] || { echo "Could not find the worker URL in the deploy output"; exit 1; }
          printf '{"url":"%s"}\n' "$url" > ../docs/live.json
      - name: Point the page at the worker
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: |
          git config user.name "market-digest bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/live.json
          git diff --cached --quiet && exit 0
          git commit -m "Point the page at the live worker"
          git pull --rebase origin main && git push
      - name: Missing Cloudflare secrets
        if: env.CLOUDFLARE_API_TOKEN == ''
        run: echo "Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repo secrets, then run this again."
