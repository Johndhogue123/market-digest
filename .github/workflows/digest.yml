name: Market digest

on:
  schedule:
    # Times are UTC. Each lands inside market hours in both EDT and EST:
    # 14:45 = 10:45am EDT / 9:45am EST, 17:30 = 1:30pm / 12:30pm, 21:15 = 5:15pm / 4:15pm.
    - cron: "45 14 * * 1-5"
    - cron: "30 17 * * 1-5"
    - cron: "15 21 * * 1-5"
  workflow_dispatch:
    inputs:
      force:
        description: "Run even if the market is closed today"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: digest
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build digest
        env:
          ALPACA_KEY_ID: ${{ secrets.ALPACA_KEY_ID }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
        run: python digest.py ${{ inputs.force && '--force' || '' }}
      - name: Publish
        run: |
          git config user.name "market-digest bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/data.json
          git diff --cached --quiet || (git commit -m "Digest update $(date -u +%Y-%m-%dT%H:%MZ)" && git push)
