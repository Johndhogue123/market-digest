name: Market digest

on:
  schedule:
    # Every 15 minutes (offset from :00 to dodge GitHub schedule congestion), 11:00-22:59 UTC on weekdays. That covers pre-market (from 7am ET) and market hours in
    # both EDT and EST; digest.py exits early outside 7am-5:05pm ET and on holidays.
    # GitHub may start scheduled runs a few minutes late at busy times.
    - cron: "7,22,37,52 11-22 * * 1-5"
  workflow_dispatch:
    inputs:
      force:
        description: "Run even if the market is closed today"
        type: boolean
        default: false
      sparks:
        description: "Only rebuild the sparkline file for the symbols on the page (works when the market is closed)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: digest
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build digest
        env:
          ALPACA_KEY_ID: ${{ secrets.ALPACA_KEY_ID }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          FINNHUB_KEY: ${{ secrets.FINNHUB_KEY }}
        run: python digest.py ${{ inputs.force && '--force' || '' }} ${{ inputs.sparks && '--sparks' || '' }}
      - name: Publish
        run: |
          git config user.name "market-digest bot"
          git config user.email "actions@users.noreply.github.com"
          for f in docs/data.json docs/baseline.json docs/premarket.json docs/exchanges.json docs/news.json docs/spark.json docs/earnings.json docs/market.json docs/paper.json; do [ -f "$f" ] && git add "$f"; done
          git diff --cached --quiet && exit 0
          git commit -m "Digest update $(date -u +%Y-%m-%dT%H:%MZ)"
          # These files are regenerated whole each run, so if another run pushed first, keep this run's copy (-X theirs = our commit during a rebase) instead of failing on a conflict.
          for i in 1 2 3; do
            git pull --rebase -X theirs origin main && git push && exit 0
            git rebase --abort 2>/dev/null || true
            sleep 5
          done
          exit 1
