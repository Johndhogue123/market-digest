name: Market digest

on:
  schedule:
    # Every 15 minutes, 11:00-21:59 UTC on weekdays. That covers pre-market (from 7am ET) and market hours in
    # both EDT and EST; digest.py exits early outside 7am-4:20pm ET and on holidays.
    # GitHub may start scheduled runs a few minutes late at busy times.
    - cron: "*/15 11-21 * * 1-5"
  workflow_dispatch:
    inputs:
      force:
        description: "Run even if the market is closed today"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: digest
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build digest
        env:
          ALPACA_KEY_ID: ${{ secrets.ALPACA_KEY_ID }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          FINNHUB_KEY: ${{ secrets.FINNHUB_KEY }}
        run: python digest.py ${{ inputs.force && '--force' || '' }}
      - name: Publish
        run: |
          git config user.name "market-digest bot"
          git config user.email "actions@users.noreply.github.com"
          for f in docs/data.json docs/baseline.json docs/premarket.json docs/exchanges.json; do [ -f "$f" ] && git add "$f"; done
          git diff --cached --quiet && exit 0
          git commit -m "Digest update $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase origin main && git push
